# Adversarial training defense

experiment:
  name: "defense_adversarial_training"
  seed: 42
  device: "cuda"

data:
  dataset: "cifar10"
  batch_size: 128

model:
  architecture: "resnet18"
  dropout: 0.3

training:
  epochs: 76  # Madry et al. train for longer
  lr: 0.1
  weight_decay: 0.0002
  patience: 15

defense:
  type: "adversarial_training"
  attack_epsilon: 0.031  # 8/255
  attack_alpha: 0.008
  attack_steps: 7
  clean_ratio: 0.5  # Mix 50% clean + 50% adversarial